<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .title { font: 24px sans-serif; font-weight: 600; }
    .box { fill: #f8f8f8; stroke: #333; stroke-width: 1.5; }
    .header { font: 16px sans-serif; font-weight: 600; }
    .text { font: 13px sans-serif; }
    .line { stroke: #333; stroke-width: 1.4; marker-end: url(#arrow); }
    .swim { fill: #ffffff; stroke: #555; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#333" />
    </marker>
  </defs>

  <text x="700" y="40" text-anchor="middle" class="title">Release System - System Architecture</text>

  <!-- User -->
  <circle cx="120" cy="110" r="30" fill="#ffffff" stroke="#333" stroke-width="1.5" />
  <text x="120" y="155" text-anchor="middle" class="text">Admin/Developer</text>

  <!-- Frontend -->
  <rect x="260" y="70" width="420" height="160" class="swim" />
  <text x="470" y="95" text-anchor="middle" class="header">Frontend (React)</text>
  <rect x="290" y="115" width="170" height="80" class="box" />
  <text x="375" y="150" text-anchor="middle" class="text">API Client</text>
  <text x="375" y="168" text-anchor="middle" class="text">(VITE_API_URL)</text>
  <rect x="490" y="115" width="170" height="80" class="box" />
  <text x="575" y="150" text-anchor="middle" class="text">Activity Feed</text>
  <text x="575" y="168" text-anchor="middle" class="text">(SSE consumer)</text>

  <!-- Release Service -->
  <rect x="80" y="260" width="1240" height="360" class="swim" />
  <text x="700" y="285" text-anchor="middle" class="header">Release Service (Spring Boot)</text>

  <rect x="120" y="320" width="170" height="70" class="box" />
  <text x="205" y="350" text-anchor="middle" class="text">AuthController</text>
  <text x="205" y="368" text-anchor="middle" class="text">/auth</text>

  <rect x="310" y="320" width="170" height="70" class="box" />
  <text x="395" y="350" text-anchor="middle" class="text">ReleaseController</text>
  <text x="395" y="368" text-anchor="middle" class="text">/releases</text>

  <rect x="500" y="320" width="170" height="70" class="box" />
  <text x="585" y="350" text-anchor="middle" class="text">TaskController</text>
  <text x="585" y="368" text-anchor="middle" class="text">/tasks</text>

  <rect x="690" y="320" width="170" height="70" class="box" />
  <text x="775" y="350" text-anchor="middle" class="text">CommentController</text>
  <text x="775" y="368" text-anchor="middle" class="text">/comments</text>

  <rect x="880" y="320" width="170" height="70" class="box" />
  <text x="965" y="350" text-anchor="middle" class="text">ChatController</text>
  <text x="965" y="368" text-anchor="middle" class="text">/chat</text>

  <rect x="1070" y="320" width="170" height="70" class="box" />
  <text x="1155" y="350" text-anchor="middle" class="text">ActivityStreamService</text>
  <text x="1155" y="368" text-anchor="middle" class="text">/activity/stream</text>

  <rect x="470" y="420" width="200" height="70" class="box" />
  <text x="570" y="455" text-anchor="middle" class="text">ReleaseService</text>

  <rect x="760" y="420" width="200" height="70" class="box" />
  <text x="860" y="455" text-anchor="middle" class="text">OllamaService</text>

  <rect x="300" y="520" width="220" height="70" class="box" />
  <text x="410" y="555" text-anchor="middle" class="text">KafkaProducerService</text>

  <rect x="600" y="520" width="240" height="70" class="box" />
  <text x="720" y="555" text-anchor="middle" class="text">MongoDB</text>
  <text x="720" y="572" text-anchor="middle" class="text">releases/users/chat_sessions</text>

  <!-- Notification Service -->
  <rect x="360" y="650" width="700" height="200" class="swim" />
  <text x="710" y="675" text-anchor="middle" class="header">Notification Service</text>

  <rect x="420" y="710" width="200" height="70" class="box" />
  <text x="520" y="745" text-anchor="middle" class="text">KafkaConsumerService</text>

  <rect x="640" y="710" width="170" height="70" class="box" />
  <text x="725" y="745" text-anchor="middle" class="text">EmailService</text>

  <rect x="830" y="710" width="200" height="70" class="box" />
  <text x="930" y="745" text-anchor="middle" class="text">MongoDB</text>
  <text x="930" y="762" text-anchor="middle" class="text">notification_logs</text>

  <!-- Kafka + Ollama -->
  <rect x="90" y="700" width="180" height="60" class="box" />
  <text x="180" y="735" text-anchor="middle" class="text">Kafka</text>

  <rect x="1160" y="480" width="180" height="60" class="box" />
  <text x="1250" y="515" text-anchor="middle" class="text">Ollama</text>
  <text x="1250" y="532" text-anchor="middle" class="text">/api/generate</text>

  <!-- Arrows -->
  <line x1="150" y1="110" x2="260" y2="110" class="line" />
  <line x1="375" y1="195" x2="205" y2="320" class="line" />
  <line x1="375" y1="195" x2="395" y2="320" class="line" />
  <line x1="375" y1="195" x2="585" y2="320" class="line" />
  <line x1="375" y1="195" x2="775" y2="320" class="line" />
  <line x1="375" y1="195" x2="965" y2="320" class="line" />
  <line x1="575" y1="195" x2="1155" y2="320" class="line" />

  <line x1="205" y1="390" x2="570" y2="420" class="line" />
  <line x1="395" y1="390" x2="570" y2="420" class="line" />
  <line x1="585" y1="390" x2="570" y2="420" class="line" />
  <line x1="775" y1="390" x2="570" y2="420" class="line" />
  <line x1="965" y1="390" x2="860" y2="420" class="line" />

  <line x1="570" y1="490" x2="410" y2="520" class="line" />
  <line x1="570" y1="490" x2="720" y2="520" class="line" />
  <line x1="860" y1="490" x2="720" y2="520" class="line" />
  <line x1="860" y1="455" x2="1160" y2="510" class="line" />

  <line x1="410" y1="590" x2="180" y2="700" class="line" />
  <line x1="180" y1="760" x2="520" y2="710" class="line" />
  <line x1="520" y1="780" x2="725" y2="710" class="line" />
  <line x1="520" y1="780" x2="930" y2="710" class="line" />
</svg>
